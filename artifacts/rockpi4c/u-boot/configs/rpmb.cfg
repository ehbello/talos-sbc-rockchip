# eMMC RPMB secure storage via OP-TEE, and EFI variables stored in RPMB via
# OP-TEE StandaloneMM (EDK2 BL32_AP_MM.fd). Requires the OP-TEE SPM and EDK2
# StandaloneMM to agree on the FF-A ABI: OP-TEE is bumped to 4.10 to match
# EDK2 202508 (4.5 predated the FF-A calls EDK2 202508's StandaloneMm makes).
CONFIG_SUPPORT_EMMC_RPMB=y
CONFIG_CMD_MMC_RPMB=y
CONFIG_CMD_OPTEE_RPMB=y
CONFIG_EFI_MM_COMM_TEE=y
# CONFIG_EFI_VARIABLE_FILE_STORE is not set
