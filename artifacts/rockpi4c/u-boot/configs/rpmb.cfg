# eMMC RPMB secure storage via OP-TEE (used by OP-TEE secure storage / fTPM).
#
# EFI variables via OP-TEE StandaloneMM (CONFIG_EFI_MM_COMM_TEE) stay disabled
# for now. Bumping OP-TEE 4.5 -> 4.10 fixed the FF-A syscall crash and the fTPM
# TA panic, but u-boot still can't open the StandaloneMM session
# ("Unable to open OP-TEE session (err=-5) -> mm_communicate failed -> Cannot
# initialize UEFI sub-system"): OP-TEE 4.10's StandaloneMM SP loading / its
# match with the EDK2 202508 BL32_AP_MM.fd needs work (Phase 2). Without it
# u-boot uses volatile EFI variables, which is enough to boot Talos.
CONFIG_SUPPORT_EMMC_RPMB=y
CONFIG_CMD_MMC_RPMB=y
CONFIG_CMD_OPTEE_RPMB=y
# CONFIG_EFI_VARIABLE_FILE_STORE is not set
