# eMMC RPMB secure storage via OP-TEE (used by OP-TEE secure storage / fTPM).
#
# NOTE: storing EFI variables in RPMB via OP-TEE StandaloneMM
# (CONFIG_EFI_MM_COMM_TEE) is deferred to Phase 2: the EDK2 202508
# StandaloneMM <-> OP-TEE 4.5 FF-A interface mismatches (u-boot's mm_communicate
# triggers an undefined OP-TEE SPM syscall, crashing the session and preventing
# u-boot's UEFI sub-system from initialising). Without it u-boot uses volatile
# EFI variables, which is enough to boot Talos.
CONFIG_SUPPORT_EMMC_RPMB=y
CONFIG_CMD_MMC_RPMB=y
CONFIG_CMD_OPTEE_RPMB=y
# CONFIG_EFI_VARIABLE_FILE_STORE is not set
