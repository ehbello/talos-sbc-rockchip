name: rockpi4c-dtb
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base

steps:
  - sources:
      - url: https://cdn.kernel.org/pub/linux/kernel/v{{ regexReplaceAll "(\\d+)(.\\d+)(\\.\\d+)?$" .linux_version "${1}" }}.x/linux-{{ .linux_version }}.tar.xz
        destination: linux.tar.xz
        sha256: "{{ .linux_sha256 }}"
        sha512: "{{ .linux_sha512 }}"

    prepare:
      - |
        tar -xJf linux.tar.xz --strip-components=1
        rm linux.tar.xz
      - |
        for patch in $(find /pkg/patches -type f -name "*.patch" | sort); do
          echo "Applying patch $patch"
          patch -p1 < $patch || (echo "Failed to apply patch $patch" && exit 1)
        done

    build:
      - |
          cpp -nostdinc -I include -I arch -undef -x assembler-with-cpp  arch/arm64/boot/dts/rockchip/rk3399-rock-pi-4c.dts rk3399-rock-pi-4c.dts.preprocessed
          dtc -@ -O dtb -o rk3399-rock-pi-4c.dtb rk3399-rock-pi-4c.dts.preprocessed

    install:
      - |
        mkdir -p /rootfs/dtb/rockchip

        mv rk3399-rock-pi-4c.dtb /rootfs/dtb/rockchip/rk3399-rock-pi-4c.dtb
finalize:
  - from: /rootfs
    to: /
